name: Publish reading prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - docs/sample-report.md
      - docs/product-spec.md
      - docs/deployment.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public prototype files
        run: |
          mkdir -p _site/docs
          cp index.html _site/index.html
          cp docs/sample-report.md docs/product-spec.md docs/deployment.md _site/docs/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
